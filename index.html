<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priya's Kitchen | Order & Pay</title>
    <script src="https://www.paypal.com/sdk/js?client-id=ASk9vWb2IBX0__RTXQyOhdEndrATHw_aUSj83H-LPp5hWSqNUM6vOc1gTyUA1JuFp9tRCyFcNGtNAlBv&currency=EUR"></script>
    <style>
        :root { --primary: #d97706; --secondary: #991b1b; --bg: #f3f4f6; --text: #1e293b; }
        
        body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        
        /* Layout Views */
        #menu-view, #checkout-view { padding-bottom: 100px; }
        #checkout-view { display: none; padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }

        header { padding: 1.5rem 1rem; background: white; border-bottom: 4px solid var(--primary); text-align: left; }
        h1 { font-size: 1.8rem; margin: 0; color: var(--secondary); text-transform: uppercase; }
        
        /* Menu Items */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .item-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .item-card img { width: 100%; height: 200px; object-fit: cover; }
        .item-details { padding: 15px; }
        .item-name { font-size: 1.1rem; font-weight: bold; margin: 0; color: var(--secondary); }
        .item-desc { font-size: 0.85rem; color: #64748b; font-style: italic; margin: 5px 0; }
        
        .controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; padding: 10px; background: #f1f5f9; border-radius: 12px; }
        .btn-qty { background: var(--secondary); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

        /* Floating Footer Bar (Phase 1) */
        #cart-footer { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: var(--secondary); color: white; 
            padding: 20px; display: none; justify-content: space-between; 
            align-items: center; z-index: 1000; border-radius: 20px 20px 0 0;
        }
        .checkout-btn { background: white; color: var(--secondary); padding: 10px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; }

        /* Checkout Page Elements (Phase 2) */
        .summary-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .back-btn { background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; cursor: pointer; }
        .wa-pay-btn { background: #25D366; color: white; padding: 15px; border-radius: 10px; text-decoration: none; display: block; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="menu-view">
        <header>
            <h1>Priya's Kitchen</h1>
            <p style="margin:0; font-size:0.9rem;">Austrian Home Flavors • Homemade with Love</p>
        </header>

        <div class="menu-grid" id="menu"></div>

        <div id="cart-footer">
            <div>
                <span id="footer-count">0 Items</span> | 
                <span id="footer-total" style="font-weight:bold; font-size:1.2rem;">€0.00</span>
            </div>
            <a href="#" class="checkout-btn" onclick="showCheckout()">Checkout ➔</a>
        </div>
    </div>

    <div id="checkout-view">
        <button class="back-btn" onclick="hideCheckout()">← Back to Menu</button>
        <h2 style="color:var(--secondary)">Complete Your Order</h2>
        
        <div class="summary-box" id="order-summary">
            </div>

        <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 20px;">Choose a payment method to finalize:</p>
        
        <div id="paypal-button-container"></div>
        
        <div style="margin: 20px 0; color: #94a3b8;">— OR —</div>
        
        <button class="wa-pay-btn" onclick="sendWhatsApp('UNPAID')">💬 Order & Pay via WhatsApp</button>
    </div>

    <script>
        const PHONE_NUMBER = "436642174223"; 
        const CURRENCY_SYMBOL = "€"; 

        const menuItems = [
            { id: 1, name: "Veg Manchurian Gravy", price: 10.00, img: "manchurian.jpg", desc: "Golden veggie clouds in silky gravy." },
            { id: 2, name: "Veg Hakka Noodles", price: 8.50, img: "noodles.jpg", desc: "Smoky wok-tossed peppers and noodles." },
            { id: 3, name: "Schezewan Fried Rice", price: 9.50, img: "rice.jpg", desc: "Spicy fire-tossed rice with chili oil." },
            { id: 4, name: "Dhai Vada", price: 7.00, img: "vada.jpg", desc: "Soft pillows in chilled spiced yogurt." },
            { id: 5, name: "Veg Dhum Biryani", price: 14.00, img: "biryani.jpg", desc: "Slow-cooked Basmati with secret spices." }
        ];

        let cart = {};

        function renderMenu() {
            const menuDiv = document.getElementById('menu');
            menuDiv.innerHTML = menuItems.map(item => `
                <div class="item-card">
                    <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Food+Image'">
                    <div class="item-details">
                        <p class="item-name">${item.name}</p>
                        <p style="font-weight:bold; color:var(--primary)">${CURRENCY_SYMBOL}${item.price.toFixed(2)}</p>
                        <div class="controls">
                            <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                            <span class="qty-display" id="qty-${item.id}">0</span>
                            <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, delta) {
            const currentQty = cart[id] || 0;
            const newQty = Math.max(0, currentQty + delta);
            if (newQty === 0) delete cart[id]; else cart[id] = newQty;
            document.getElementById(`qty-${id}`).innerText = newQty;
            updateCart();
        }

        function updateCart() {
            let total = 0; let count = 0;
            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                total += item.price * cart[id];
                count += cart[id];
            }
            
            // Show/Hide Footer
            const footer = document.getElementById('cart-footer');
            footer.style.display = count > 0 ? 'flex' : 'none';
            
            document.getElementById('footer-total').innerText = `${CURRENCY_SYMBOL}${total.toFixed(2)}`;
            document.getElementById('footer-count').innerText = `${count} Items`;
            return total.toFixed(2);
        }

        function showCheckout() {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('checkout-view').style.display = 'block';
            window.scrollTo(0,0);
            
            // Generate Summary
            let summaryHtml = "<h3>Your Order:</h3>";
            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                summaryHtml += `<p>• ${item.name} x ${cart[id]} (${CURRENCY_SYMBOL}${(item.price * cart[id]).toFixed(2)})</p>`;
            }
            summaryHtml += `<hr><p><strong>Total: ${CURRENCY_SYMBOL}${updateCart()}</strong></p>`;
            document.getElementById('order-summary').innerHTML = summaryHtml;
        }

        function hideCheckout() {
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('checkout-view').style.display = 'none';
        }

        function sendWhatsApp(status) {
            let message = `*NEW ORDER - ${status}*%0A%0A`;
            let total = 0;
            for (let id in cart) {
                const item = menuItems.find(i => i.id == id);
                const lineTotal = item.price * cart[id];
                total += lineTotal;
                message += `• ${item.name} x ${cart[id]} (${CURRENCY_SYMBOL}${lineTotal.toFixed(2)})%0A`;
            }
            message += `%0A*Total: ${CURRENCY_SYMBOL}${total.toFixed(2)}*`;
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${message}`, '_blank');
        }

        renderMenu();

        if (typeof paypal !== 'undefined') {
            paypal.Buttons({
                createOrder: function(data, actions) {
                    return actions.order.create({ purchase_units: [{ amount: { currency_code: 'EUR', value: updateCart() } }] });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function() { sendWhatsApp('PAID VIA PAYPAL'); });
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
